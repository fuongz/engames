name: Secret scan

# Scans the whole git history with gitleaks. A secret that was committed and
# later deleted is still in history (and public), so every run reads all of it.
# Findings fail the job and show up under Security → Code scanning.
#
# Local equivalent: `bun run secrets` (needs gitleaks installed).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC: catches new gitleaks rules
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    env:
      # The CLI is pinned and checksum-verified instead of using gitleaks-action,
      # which needs a license for organisation repos and sends telemetry.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the tip
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        # --redact keeps the secret value itself out of the job log and report
        run: >-
          gitleaks git
          --redact
          --verbose
          --no-banner
          --exit-code 1
          --report-format sarif
          --report-path gitleaks.sarif
          .

      - name: Upload findings to code scanning
        # Runs even when the scan fails, so the alert lands in the Security tab.
        # Skipped for PRs from forks, whose token cannot write security events.
        if: >-
          always() &&
          hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
